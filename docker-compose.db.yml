# Override opsional: sambungkan backend ke Postgres lokal (profile "db").
# Pakai:  docker compose --profile db -f docker-compose.yml -f docker-compose.db.yml up -d --build
# (db & db-seed berasal dari docker-compose.yml lewat profile "db".)
# Chat/QA jawab dari baris DB, tetap fallback JSON bila DB tumbang.
name: omnigistic

services:
  backend:
    environment:
      SKIP_DB: "0"
      DATABASE_URL: postgresql://omnigistic:omnigistic@db:5509/omnigistic
      DB_DRIVER: postgresql+psycopg
