# omnigistic — dev container (lokal saja, tanpa deploy)
# DEFAULT (hot reload): sumber di-bind-mount dari host, edit file → langsung reload.
#   docker compose up -d --build      → :3077 Svelte (vite dev + HMR), :8077 FastAPI (uvicorn --reload).
#   +DB: docker compose --profile db up -d --build  → postgres lokal + auto-seed via db-seed.
#   neon:  SKIP_DB=0 DATABASE_URL=postgres://.. docker compose up -d   (override dari .env host).
#   PROD (image build, tanpa mount):  docker compose --profile prod up -d --build
#   API public default browser = http://127.0.0.1:8077 (override: edit frontend/.env → rebuild).

services:
  # ================= DEFAULT: DEV + HOT RELOAD =================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    image: omnigistic-backend:dev
    container_name: omnigistic-backend
    environment:
      SKIP_DB: "1"                          # default: tidak konek DB, serve dari data-kas.json
      DATA_KAS_PATH: /shared/data-kas.json
      # Override bawaan dengan env host:
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8077}:8077"
    volumes:
      # Hot reload: source host → container (uvicorn --reload memantau /code/app).
      - ./backend/app:/code/app
      - ./shared/data-kas.json:/shared/data-kas.json:ro
      # Overlay Inggris: ikut di-mount agar perubahan langsung terpakai di dev
      # (tanpa rebuild image) dan tetap sinkron dengan berkas kanonik di atas.
      - ./shared/data-kas.en.json:/shared/data-kas.en.json:ro
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
    # Backend supply semua /api & /ml. Tanpa ini, container yg keluar (crash/reboot host)
    # tak pernah hidup lagi → frontend tampil tanpa data. Samakan dgn frontend.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: omnigistic-frontend:dev
    container_name: omnigistic-frontend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1:8077}
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3077}:3177"
    volumes:
      # Hot reload: source host → container (vite HMR memantau /app/src, dsb).
      - ./frontend:/app
      # node_modules tetap milik image (jangan ditimpa oleh host).
      - /app/node_modules
      - /app/.svelte-kit
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ================= PROD: image build, tanpa bind mount =================
  backend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: omnigistic-backend:local
    container_name: omnigistic-backend-prod
    environment:
      SKIP_DB: "1"
      DATA_KAS_PATH: /shared/data-kas.json
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8077}:8077"
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: omnigistic-frontend:local
    container_name: omnigistic-frontend-prod
    environment:
      HOST: 0.0.0.0
      PORT: "3077"
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3077}:3077"
    depends_on:
      - backend-prod
    restart: unless-stopped

  # ---- DB opsional (profile "db"). Nyalakan: docker compose --profile db up --build ----
  db:
    image: postgres:17-alpine
    container_name: omnigistic-db
    environment:
      POSTGRES_USER: omnigistic
      POSTGRES_PASSWORD: omnigistic
      POSTGRES_DB: omnigistic
      PGPORT: "5509"
    profiles: ["db"]
    ports:
      - "127.0.0.1:5510:5509"
    volumes:
      - omnigistic-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5509 -U omnigistic -d omnigistic"]
      interval: 4s
      timeout: 2s
      retries: 10

  # seeder one-shot (profile db): jalankan seed.py ke Postgres db.
  db-seed:
    image: omnigistic-backend:dev
    profiles: ["db"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://omnigistic:omnigistic@db:5509/omnigistic
      DB_DRIVER: postgresql+psycopg
      SKIP_DB: "0"
    command: python -c "import sys;sys.path.insert(0,'/code');from app.db.seed import seed;print('seed:',seed())"

volumes:
  omnigistic-pg:
